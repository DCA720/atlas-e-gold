name: Atlas EUR RC7.5 - Verificacao documental oficial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxe e testes simulados
        run: |
          python -m py_compile backend/atlas_eur_rc73.py backend/atlas_eur_rc74.py backend/atlas_eur_rc75.py
          python backend/atlas_eur_rc75.py --self-test
      - name: Atualizar diagnosticos oficiais (somente leitura)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc67.py > eur_rc67_result.json
          EUR_RC69_OUTPUT=eur_rc69_result.json python backend/atlas_eur_rc69.py
          python backend/atlas_eur_rc71.py --output eur_rc71_result.json
          python backend/atlas_eur_rc72.py --output eur_rc72_result.json
          python backend/atlas_eur_rc73.py --input-dir . --output eur_rc73_result.json
          python backend/atlas_eur_rc74.py --input eur_rc73_result.json --output eur_rc74_result.json
      - name: Recuperar documentos oficiais e auditar evidencias
        run: |
          python backend/atlas_eur_rc75.py --input eur_rc74_result.json --output eur_rc75_result.json
          python - <<'PY'
          import json
          r=json.load(open('eur_rc75_result.json',encoding='utf-8'))
          assert r['input_valid'] and r['documents_attempted'] >= 7
          assert r['eligible_count']==0 and r['relative_score'] is None
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert r['verified_point_in_time_events']==0
          assert all(e['available_asof_utc'] is None and not e['point_in_time_usable'] for e in r['publication_events'])
          assert not any(r[k] for k in ('signals_generated','database_writes',
                  'production_change_authorized','point_in_time_backtest_authorized'))
          print('RC75_SAFETY_GATES_OK')
          PY
      - name: Publicar auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc75-diagnostico
          path: |
            eur_rc73_result.json
            eur_rc74_result.json
            eur_rc75_result.json
          if-no-files-found: warn
