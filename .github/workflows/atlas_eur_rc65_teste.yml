name: Atlas EUR RC6.5 - Auditoria de revisoes CPI e HICP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria-rc65:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m py_compile backend/atlas_eur_rc62.py backend/atlas_eur_rc63.py backend/atlas_eur_rc64.py backend/atlas_eur_rc65.py
      - name: Testar auditoria com dados sinteticos
        run: |
          PYTHONPATH=backend python - <<'PY'
          from atlas_eur_rc65 import evaluate
          def mock(date, key):
              values = {
                  '2026-10-14': {'2025-09':324.8,'2025-10':None,'2026-09':336.94,'2026-10':None},
                  '2026-11-10': {'2025-09':324.8,'2025-10':None,'2026-09':336.94,'2026-10':337.511},
                  '2026-11-17': {'2025-09':324.8,'2025-10':None,'2026-09':337.04,'2026-10':337.511}}
              return {'status':'ok','index_levels':values[date]}
          d = evaluate(fetcher=mock, api_key='test')
          assert d['us_comparison_summary']['changed_values'] == 1
          assert d['us_comparison_summary']['newly_present'] == 1
          assert d['us_comparison_summary']['missing_in_both'] == 2
          assert not d['eu_original_values_verified']
          assert not d['historical_vintage_per_observation_verified']
          assert not d['point_in_time_backtest_authorized']
          assert d['relative_score'] is None and d['eligible_count'] == 0
          assert not d['signals_generated'] and not d['database_writes']
          print('Testes sinteticos RC6.5 aprovados')
          PY
      - name: Executar diagnostico real
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backend/atlas_eur_rc65.py > eur_rc65_result.json
      - name: Verificar invariantes
        run: |
          python - <<'PY'
          import json
          with open('eur_rc65_result.json', encoding='utf-8') as f: d=json.load(f)
          assert d['model_version'].startswith('eur-rc6.5')
          assert len(d['us_revision_comparisons']) == 8
          assert not d['historical_vintage_per_observation_verified']
          assert not d['point_in_time_backtest_authorized']
          assert d['eligible_count'] == 0 and d['relative_score'] is None
          assert not d['signals_generated'] and not d['database_writes']
          assert not d['production_change_authorized']
          print('Invariantes RC6.5 preservadas')
          PY
      - name: Anexar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc65-diagnostico
          path: eur_rc65_result.json
          if-no-files-found: warn
