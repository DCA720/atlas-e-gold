name: Atlas EUR RC5.4 - Consolidacao de evidencias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico-rc54:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m py_compile backend/atlas_eur_rc54.py backend/atlas_eur_rc53.py backend/atlas_eur_rc52.py backend/atlas_eur_rc51.py backend/atlas_eur_rc5.py backend/eur_score_rc4.py backend/eur_macro_sources.py
      - name: Executar diagnostico
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backend/atlas_eur_rc54.py > eur_rc54_result.json
      - name: Validar contrato e divergencia
        run: |
          python - <<'PYCODE'
          import json
          with open('eur_rc54_result.json', encoding='utf-8') as f:
              d = json.load(f)
          assert d['signals_generated'] is False
          assert d['database_writes'] is False
          assert d['relative_score'] is None
          assert d['eligible_count'] == 0
          assert d['horizons']['1d']['score'] is None
          assert d['horizons']['5d']['score'] is None
          assert set(d['evidence_registry']) == {'inflation', 'unemployment', 'rates', 'activity'}
          assert d['geography']['full_pipeline_verified'] is False
          print('RC5.4: contrato conservador validado')
          PYCODE
      - name: Anexar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc54-diagnostico
          path: eur_rc54_result.json
          if-no-files-found: warn
