name: Atlas EUR RC5.7 - Auditoria series inflacao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria-rc57:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m py_compile backend/atlas_eur_rc57.py
      - name: Executar auditoria
        run: python backend/atlas_eur_rc57.py > eur_rc57_result.json
      - name: Validar bloqueios
        run: |
          python - <<'PYCODE'
          import json
          with open('eur_rc57_result.json', encoding='utf-8') as f:
              d = json.load(f)
          assert set(d['sources']) == {'rc3_minr', 'rc56_manr'}
          assert d['relative_score'] is None and d['eligible_count'] == 0
          assert d['signals_generated'] is False and d['database_writes'] is False
          assert d['production_change_authorized'] is False
          for source in d['sources'].values():
              assert len(source['cases']) == 4
          print('RC5.7: contrato conservador validado')
          PYCODE
      - name: Anexar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc57-diagnostico
          path: eur_rc57_result.json
          if-no-files-found: warn
