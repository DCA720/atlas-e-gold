name: Atlas RC12 - Monitoramento e validacao automatica

on:
  workflow_dispatch:
  schedule:
    # Dias uteis, 16:00 UTC = 13:00 em Brasilia (UTC-3).
    - cron: '0 16 * * 1-5'

permissions:
  contents: read

concurrency:
  group: atlas-rc12-validacao
  cancel-in-progress: false

jobs:
  monitorar-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PostgreSQL client
        run: python -m pip install 'psycopg[binary]'

      - name: Acordar Render e aguardar atualizacao
        env:
          ATLAS_API_URL: https://atlas-usd-gold-api.onrender.com
        run: python backend/rc12_wake.py

      - name: Validar sinais maduros e gravar agregados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/validate_postgres.py --save
