name: Atlas EUR RC7.7 - Validacao contextual documental
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe e testes locais
        run: |
          python -m py_compile backend/atlas_eur_rc77.py
          python backend/atlas_eur_rc77.py --self-test
      - name: Executar cadeia de auditorias somente leitura
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc67.py > eur_rc67_result.json
          EUR_RC69_OUTPUT=eur_rc69_result.json python backend/atlas_eur_rc69.py
          python backend/atlas_eur_rc71.py --output eur_rc71_result.json
          python backend/atlas_eur_rc72.py --output eur_rc72_result.json
          python backend/atlas_eur_rc73.py --input-dir . --output eur_rc73_result.json
          python backend/atlas_eur_rc74.py --input eur_rc73_result.json --output eur_rc74_result.json
          python backend/atlas_eur_rc75.py --input eur_rc74_result.json --output eur_rc75_result.json
          python backend/atlas_eur_rc76.py --input eur_rc75_result.json --output eur_rc76_result.json
      - name: Classificar evidencias e validar bloqueios
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc77.py --input eur_rc76_result.json --output eur_rc77_result.json
          python - <<'PY'
          import json
          r=json.load(open('eur_rc77_result.json',encoding='utf-8'))
          assert r['input_valid'] and r['documents_reviewed']>=7
          assert r['eligible_count']==0 and r['coverage']==0.0 and r['relative_score'] is None
          assert r['verified_point_in_time_events']==0
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert all(e['available_asof_utc'] is None and not e['point_in_time_usable'] for e in r['publication_events'])
          assert not any(r[k] for k in ('signals_generated','database_writes','production_change_authorized','point_in_time_backtest_authorized'))
          print('RC77_SAFETY_GATES_OK')
          PY
      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc77-diagnostico
          path: |
            eur_rc76_result.json
            eur_rc77_result.json
          if-no-files-found: warn
