name: Atlas EUR RC8.5 - Proveniencia independente de publicacao
on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: "ID da execucao RC8.2 anterior (opcional; sem ID, nao compara)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe e testes locais
        run: |
          python -m py_compile backend/atlas_eur_rc78.py backend/atlas_eur_rc79.py backend/atlas_eur_rc80.py backend/atlas_eur_rc81.py backend/atlas_eur_rc82.py backend/atlas_eur_rc83.py backend/atlas_eur_rc84.py backend/atlas_eur_rc85.py
          python backend/atlas_eur_rc78.py --self-test
          python backend/atlas_eur_rc79.py --self-test
          python backend/atlas_eur_rc80.py --self-test
          python backend/atlas_eur_rc81.py --self-test
          python backend/atlas_eur_rc82.py --self-test
          python backend/atlas_eur_rc83.py --self-test
          python backend/atlas_eur_rc84.py --self-test
          python backend/atlas_eur_rc85.py --self-test
      - name: Executar cadeia de auditorias somente leitura
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc67.py > eur_rc67_result.json
          EUR_RC69_OUTPUT=eur_rc69_result.json python backend/atlas_eur_rc69.py
          python backend/atlas_eur_rc71.py --output eur_rc71_result.json
          python backend/atlas_eur_rc72.py --output eur_rc72_result.json
          python backend/atlas_eur_rc73.py --input-dir . --output eur_rc73_result.json
          python backend/atlas_eur_rc74.py --input eur_rc73_result.json --output eur_rc74_result.json
          python backend/atlas_eur_rc75.py --input eur_rc74_result.json --output eur_rc75_result.json
          python backend/atlas_eur_rc76.py --input eur_rc75_result.json --output eur_rc76_result.json
      - name: Gerar triagem contextual RC7.7
        run: python backend/atlas_eur_rc77.py --input eur_rc76_result.json --output eur_rc77_result.json
      - name: Vincular documentos RC7.8
        run: python backend/atlas_eur_rc78.py --input eur_rc77_result.json --output eur_rc78_result.json
      - name: Recuperar comunicados individuais e validar bloqueios
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc79.py --input eur_rc78_result.json --output eur_rc79_result.json
          python - <<'PYTEST'
          import json
          r=json.load(open('eur_rc79_result.json',encoding='utf-8'))
          assert r['input_valid'] and r['documents_attempted']==7
          assert r['documents_retrieved'] <= 7
          assert r['eligible_count']==0 and r['coverage']==0.0 and r['relative_score'] is None
          assert r['verified_point_in_time_events']==0
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert all(not d['point_in_time_usable'] and not d['first_release_dataset_vintage_verified'] for d in r['documents'])
          assert not any(r[k] for k in ('signals_generated','database_writes','production_change_authorized','point_in_time_backtest_authorized'))
          print('RC79_SAFETY_GATES_OK')
          PYTEST
      - name: Auditar snapshots historicos RC8.0
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc80.py --input eur_rc79_result.json --output eur_rc80_result.json
          python - <<'PYTEST'
          import json
          r=json.load(open('eur_rc80_result.json', encoding='utf-8'))
          assert r['input_valid'] and r['documents_checked']==7
          assert r['historical_queries_attempted']==5
          assert r['eligible_count']==0 and r['coverage']==0.0 and r['relative_score'] is None
          assert r['verified_point_in_time_events']==0
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert all(not s['point_in_time_usable'] for s in r['historical_snapshots'])
          assert not any(r[k] for k in ('signals_generated','database_writes','production_change_authorized','point_in_time_backtest_authorized'))
          print('RC80_SAFETY_GATES_OK')
          PYTEST
      - name: Auditar integridade documental RC8.1
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc81.py --rc79 eur_rc79_result.json --rc80 eur_rc80_result.json --output eur_rc81_result.json
          python - <<'PYTEST'
          import json
          r=json.load(open('eur_rc81_result.json', encoding='utf-8'))
          assert r['input_valid'] and r['documents_compared']==7 and r['snapshots_reviewed']==5
          assert r['hash_matches']+r['hash_mismatches']==7
          assert r['eligible_count']==0 and r['coverage']==0.0 and r['relative_score'] is None
          assert r['verified_point_in_time_events']==0
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert all(not d['point_in_time_usable'] for d in r['document_integrity'])
          assert not any(r[k] for k in ('signals_generated','database_writes','production_change_authorized','point_in_time_backtest_authorized'))
          print('RC81_SAFETY_GATES_OK')
          PYTEST
      - name: Capturar HTML bruto e texto canonico RC8.2
        run: |
          set -euo pipefail
          # Um manifesto de execucao anterior pode ser versionado manualmente
          # em audit_baselines/eur_rc82_result.json. Sem ele, nao ha
          # alegacao de comparacao historica entre execucoes.
          if [ -f audit_baselines/eur_rc82_result.json ]; then
            python backend/atlas_eur_rc82.py --input eur_rc81_result.json --output eur_rc82_result.json --archive-dir eur_rc82_archive --baseline audit_baselines/eur_rc82_result.json
          else
            python backend/atlas_eur_rc82.py --input eur_rc81_result.json --output eur_rc82_result.json --archive-dir eur_rc82_archive
          fi
          python - <<'PYTEST'
          import json, pathlib, hashlib
          r=json.load(open('eur_rc82_result.json',encoding='utf-8'))
          assert r['input_valid'] and r['documents_attempted']==7
          assert r['eligible_count']==0 and r['coverage']==0.0 and r['relative_score'] is None
          assert r['verified_point_in_time_events']==0
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert not any(r[k] for k in ('signals_generated','database_writes','production_change_authorized','point_in_time_backtest_authorized'))
          for d in r['documents']:
            assert not d['point_in_time_usable']
            if d['status']=='retrieved':
              for path_key, hash_key in (('html_path','html_sha256'),('text_path','canonical_text_sha256')):
                b=(pathlib.Path('eur_rc82_archive')/d[path_key]).read_bytes()
                assert hashlib.sha256(b).hexdigest()==d[hash_key]
          print('RC82_ARCHIVE_SAFETY_GATES_OK',r['documents_retrieved'])
          PYTEST
      - name: Recuperar captura RC8.2 de outra execucao
        if: ${{ inputs.baseline_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          set -euo pipefail
          mkdir -p eur_rc82_baseline
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name eur-rc82-diagnostico --dir eur_rc82_baseline
          test -f eur_rc82_baseline/eur_rc82_result.json
          test -d eur_rc82_baseline/eur_rc82_archive
      - name: Comparar capturas independentes RC8.3
        run: |
          set -euo pipefail
          if [ -f eur_rc82_baseline/eur_rc82_result.json ]; then
            python backend/atlas_eur_rc83.py --baseline eur_rc82_baseline/eur_rc82_result.json --baseline-dir eur_rc82_baseline/eur_rc82_archive --current eur_rc82_result.json --current-dir eur_rc82_archive --output eur_rc83_result.json
          else
            python backend/atlas_eur_rc83.py --current eur_rc82_result.json --current-dir eur_rc82_archive --output eur_rc83_result.json
          fi
          python - <<'PYTEST'
          import json
          r=json.load(open('eur_rc83_result.json',encoding='utf-8'))
          assert r['input_valid'] and r['eligible_count']==0 and r['coverage']==0.0
          assert r['relative_score'] is None and r['verified_point_in_time_events']==0
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert not any(r[k] for k in ('signals_generated','database_writes','production_change_authorized','point_in_time_backtest_authorized'))
          assert all(not d['economic_revision_proven'] and not d['point_in_time_usable'] for d in r['comparisons'])
          print('RC83_SAFETY_GATES_OK',r['documents_compared'])
          PYTEST
      - name: Auditar cronologia e primeira divulgacao RC8.4
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc84.py --rc79 eur_rc79_result.json --rc80 eur_rc80_result.json --rc83 eur_rc83_result.json --output eur_rc84_result.json
          python - <<'PYTEST'
          import json
          r=json.load(open('eur_rc84_result.json',encoding='utf-8'))
          assert r['input_valid'] and r['events_reviewed']==7
          assert r['verified_point_in_time_events']==0 and r['eligible_count']==0
          assert r['relative_score'] is None and r['coverage']==0.0
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert all(not e['point_in_time_usable'] for e in r['evidence_events'])
          assert not any(r[k] for k in ('signals_generated','database_writes','production_change_authorized','point_in_time_backtest_authorized'))
          print('RC84_SAFETY_GATES_OK')
          PYTEST
      - name: Auditar metadados HTTP e proveniencia independente RC8.5
        run: |
          set -euo pipefail
          python backend/atlas_eur_rc85.py --input eur_rc84_result.json --output eur_rc85_result.json --online
          python - <<'PYTEST'
          import json
          r=json.load(open('eur_rc85_result.json',encoding='utf-8'))
          assert r['input_valid'] and r['events_reviewed']==7
          assert r['verified_point_in_time_events']==0 and r['eligible_count']==0
          assert r['coverage']==0.0 and r['relative_score'] is None
          assert all(not v for v in r['eligibility'].values())
          assert all(r['horizons'][h]['score'] is None for h in ('1d','5d'))
          assert all(not e['point_in_time_usable'] and not e['independent_first_dissemination_verified'] for e in r['events'])
          assert not any(r[k] for k in ('signals_generated','database_writes','production_change_authorized','point_in_time_backtest_authorized'))
          print('RC85_SAFETY_GATES_OK',r['http_responses'])
          PYTEST
      - name: Publicar diagnostico e arquivos brutos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc85-diagnostico
          retention-days: 90
          path: |
            eur_rc79_result.json
            eur_rc80_result.json
            eur_rc81_result.json
            eur_rc82_result.json
            eur_rc83_result.json
            eur_rc84_result.json
            eur_rc85_result.json
            eur_rc82_baseline/
            eur_rc82_archive/
          if-no-files-found: warn
