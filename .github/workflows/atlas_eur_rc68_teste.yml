name: Atlas EUR RC6.8 - Diagnostico juros BCE x Fed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m py_compile backend/atlas_eur_rc68.py
      - name: Executar diagnostico (sem alterar producao)
        id: diagnostic
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EUR_RC68_OUTPUT: eur_rc68_result.json
        run: python backend/atlas_eur_rc68.py
      - name: Publicar resultado mesmo se fonte falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc68-diagnostico
          path: eur_rc68_result.json
          if-no-files-found: warn
      - name: Falhar caso o diagnostico nao passe
        if: steps.diagnostic.outcome == 'failure'
        run: exit 1
