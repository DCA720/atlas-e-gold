name: Atlas EUR RC7.0 - Diagnostico desemprego Europa x EUA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m py_compile backend/atlas_eur_rc70.py
      - name: Testes locais simulados
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'backend')
          from atlas_eur_rc70 import decode_jsonstat, changes
          sample = {'id':['geo','time'], 'size':[1,3],
            'dimension': {'time': {'category': {'index': {'2026-01':0,'2026-02':1,'2026-03':2}}}},
            'value': {'0':6.2, '1':6.1, '2':6.1}}
          assert decode_jsonstat(sample) == {'2026-01':6.2, '2026-02':6.1, '2026-03':6.1}
          assert len(changes(decode_jsonstat(sample))) == 1
          print('Testes simulados OK')
          PY
      - name: Auditoria de fontes reais
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ATLAS_EUR_OUTPUT: eur_rc70_result.json
        run: python backend/atlas_eur_rc70.py
      - name: Verificar bloqueios de seguranca
        run: |
          python - <<'PY'
          import json
          x = json.load(open('eur_rc70_result.json', encoding='utf-8'))
          assert x['eligible_count'] == 0
          assert x['relative_score'] is None
          assert not x['point_in_time_backtest_authorized']
          assert not x['signals_generated']
          assert not x['database_writes']
          assert not x['production_change_authorized']
          print('Bloqueios preservados')
          PY
      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc70-diagnostico
          path: eur_rc70_result.json
          if-no-files-found: warn
