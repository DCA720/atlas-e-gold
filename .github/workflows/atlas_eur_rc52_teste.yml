name: Atlas EUR RC5.2 - Auditoria metodologica

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico-rc52:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m py_compile backend/atlas_eur_rc52.py backend/atlas_eur_rc51.py backend/atlas_eur_rc5.py backend/eur_score_rc4.py
      - name: Executar auditoria
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backend/atlas_eur_rc52.py > eur_rc52_result.json
      - name: Validar contrato de seguranca
        run: |
          python - <<'PYCODE'
          import json
          with open('eur_rc52_result.json', encoding='utf-8') as f:
              d = json.load(f)
          assert d['signals_generated'] is False
          assert d['database_writes'] is False
          assert d['relative_score'] is None
          assert d['eligible_count'] == 0
          assert d['horizons']['1d']['score'] is None
          assert d['horizons']['5d']['score'] is None
          assert set(d['methodology_audit']) == {'activity', 'unemployment'}
          print('RC5.2: diagnostico somente leitura validado')
          PYCODE
      - name: Anexar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc52-diagnostico
          path: eur_rc52_result.json
          if-no-files-found: warn
