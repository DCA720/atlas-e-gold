name: Atlas EUR RC4.3 - Auditoria FRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Auditar series FRED sem gravar dados
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backend/atlas_eur_rc43_auditoria.py > eur_rc43_auditoria.json
      - name: Publicar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc43-auditoria
          path: eur_rc43_auditoria.json
          if-no-files-found: warn
