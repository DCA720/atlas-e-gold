name: Atlas EUR RC5.8 - Padronizacao experimental HICP EA21

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditoria-rc58:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m py_compile backend/atlas_eur_rc57.py backend/atlas_eur_rc58.py
      - name: Executar auditoria
        run: python backend/atlas_eur_rc58.py > eur_rc58_result.json
      - name: Validar contrato conservador
        run: |
          python - <<'PYCODE'
          import json
          with open('eur_rc58_result.json', encoding='utf-8') as f:
              d = json.load(f)
          assert set(d['series_audit']) == {'EA20', 'EA21'}
          assert d['candidate_dataset'] == 'prc_hicp_minr'
          assert d['relative_score'] is None and d['eligible_count'] == 0
          assert d['signals_generated'] is False and d['database_writes'] is False
          assert d['production_change_authorized'] is False
          print('RC5.8: bloqueios preservados')
          PYCODE
      - name: Anexar diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eur-rc58-diagnostico
          path: eur_rc58_result.json
          if-no-files-found: warn
